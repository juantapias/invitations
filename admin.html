<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1D2C5E">
  <meta name="robots" content="noindex, nofollow">
  <title>Panel de invitados</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23fff' stroke='%23111' stroke-width='8'/%3E%3Cpath d='M4 50a46 46 0 0 1 92 0z' fill='%23E3350D' stroke='%23111' stroke-width='8'/%3E%3Ccircle cx='50' cy='50' r='14' fill='%23fff' stroke='%23111' stroke-width='8'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/admin.css">
  <script src="js/config.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/admin.js" defer></script>
</head>
<body class="admin">
  <div class="app admin__app">
    <header class="admin__head">
      <svg class="admin__ball" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10.5" fill="#fff" stroke="#1D2C5E" stroke-width="2"/><path d="M1.5 12a10.5 10.5 0 0 1 21 0z" fill="#E3350D" stroke="#1D2C5E" stroke-width="2"/><circle cx="12" cy="12" r="3.4" fill="#fff" stroke="#1D2C5E" stroke-width="2"/></svg>
      <div>
        <h1 class="admin__title">Panel de invitados</h1>
        <p class="admin__sub" id="subtitle"></p>
      </div>
    </header>

    <p class="admin__demo" id="demoNote" hidden>Modo demo: estás viendo las respuestas guardadas en este navegador. Configura <code>apiUrl</code> para ver las de todos.</p>

    <form class="card admin__login" id="loginForm" hidden>
      <label class="field__lbl" for="key">Clave de administrador</label>
      <input class="field__input" id="key" type="password" autocomplete="current-password" required>
      <button class="btn btn--primary btn--block" type="submit"><span>Entrar</span></button>
      <p class="form__error" id="loginError" role="alert" hidden></p>
    </form>

    <main id="dash" hidden>
      <section class="stats">
        <div class="stat stat--big">
          <span class="stat__num" id="sPersonas">0</span>
          <span class="stat__lbl">personas asistirán</span>
        </div>
        <div class="stat stat--yes">
          <span class="stat__num" id="sSi">0</span>
          <span class="stat__lbl">confirmaron</span>
        </div>
        <div class="stat stat--no">
          <span class="stat__num" id="sNo">0</span>
          <span class="stat__lbl">no asistirán</span>
        </div>
      </section>

      <div class="admin__tools">
        <div class="tabs" role="tablist">
          <button class="tab is-active" role="tab" aria-selected="true" data-tab="si">Asisten <b id="tSi">0</b></button>
          <button class="tab" role="tab" aria-selected="false" data-tab="no">No asisten <b id="tNo">0</b></button>
        </div>
        <input class="field__input admin__search" id="search" type="search" placeholder="Buscar nombre…" aria-label="Buscar invitado">
      </div>

      <ul class="guests" id="list" aria-live="polite"></ul>
      <p class="guests__empty" id="empty" hidden>Aún no hay respuestas aquí.</p>

      <div class="admin__actions">
        <button class="btn btn--ghost btn--sm" type="button" id="refresh"><span>Actualizar</span></button>
        <button class="btn btn--blue btn--sm" type="button" id="csv"><span>Descargar CSV</span></button>
      </div>
      <p class="admin__updated" id="updated"></p>
    </main>
  </div>
</body>
</html>
